[project]
name = "learning-mcp"
version = "0.1.0"
description = "A small, safe filesystem MCP server for learning"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastmcp>=2.14,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
learning-mcp = "learning_mcp.main:main"
