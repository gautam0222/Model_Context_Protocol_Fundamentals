[project]
name = "agentic_terminal"
version = "0.1.0"
description = "An agentic terminal for interacting with MCP Learning"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastmcp>=2.14,<3",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mcp = "agentic_terminal.main:main"
